# This file is consumed by the RunsOn service which is hosted in our AWS account
# https://runs-on.com/configuration/repo-config/
runners:
  # ARM64 spot is often cheaper per instance than x64, but x64 (c8i/c8a) has much higher
  # single-thread performance, so compare price per unit of work for CPU-bound jobs.
  # Prices: https://go.runs-on.com/finder
  arm64:
    image: py311-postgres-arm64
    # General-purpose and compute families only; memory- and storage-optimized (r8g, i8g) cost more for no CI benefit
    family: ["c9g", "m9g", "c8g", "m8g", "c7g", "m7g"]
    extras: ["s3-cache"]
    # Disable SSH access to the runner instances
    ssh: false
    # Balance spot price against interruption risk. capacity-optimized ignores price and
    # was regularly picking pools at ~2x the cost of equivalent instance types
    spot: price-capacity-optimized

  x64:
    image: py311-postgres-x64
    # Partial names are prefix wildcards (c8i matches c8i-flex, c8id...). m8a.* excludes
    # m8azn, a high-frequency type that costs ~1.8x m8a on spot
    family: ["c8i", "c8a", "m8i", "m8a.*"]
    extras: ["s3-cache"]
    # Disable SSH access to the runner instances
    ssh: false
    # Balance spot price against interruption risk. capacity-optimized ignores price and
    # was regularly picking pools at ~2x the cost of equivalent instance types
    spot: price-capacity-optimized

images:
  py311-postgres-x64:
    platform: "linux"
    arch: "x64"
    # Our AWS Account ID
    owner: "475312562243"
    # Built using runner_images/python311-postgres18/templates/python311-postgres18.pkr.hcl
    name: x64-python311-postgres18-runs-on-2026-10-14-195757

  py311-postgres-arm64:
    platform: "linux"
    arch: "arm64"
    # Our AWS Account ID
    owner: "475312562243"
    # Built using runner_images/python311-postgres18/templates/python311-postgres18.pkr.hcl
    name: arm64-python311-postgres18-runs-on-2026-10-14-195757
