# yaml-language-server: $schema=../../../../sentence_calculator/rules/schema/law_regime_schema.json
description: Test regime that refers to the state's shared conditions.
effective_date: "2020-01-01"
term_multipliers:
  - name: shared_offense_term_reduction
    description: 15% reduction for the offenses in the state's shared conditions
    when:
      condition: shared_offense_ids
    multiplier: 0.85
    applies_to:
      max_term: always
      min_term: always
  - name: standard_term_reduction
    description: 35% reduction for every other offense
    multiplier: 0.65
    applies_to:
      max_term: always
      min_term: always
