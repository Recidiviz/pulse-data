# yaml-language-server: $schema=../../../sentence_calculator/rules/schema/law_regime_schema.json
state_code: US_XX
description: Test regime that writes its dates without quotes.
effective_date: 2020-01-01
term_multipliers:
  - name: early_start_term_reduction
    description: 50% reduction for sentences that started before 2019
    when:
      start_date: { before: 2019-01-01 }
    multiplier: 0.5
  - name: 2019_start_term_reduction
    description: 40% reduction for sentences that started in 2019
    when:
      start_date: { between_inclusive: [2019-01-01, 2019-12-31] }
    multiplier: 0.6
  - name: standard_term_reduction
    description: 35% reduction for every other sentence
    multiplier: 0.65
