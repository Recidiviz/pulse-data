# yaml-language-server: $schema=../../../sentence_calculator/rules/schema/law_regime_schema.json
description: Test regime with a misspelled offense group.
effective_date: "2020-01-01"
term_multipliers:
  - name: violent_term_reduction
    description: 15% reduction for violent offenses
    when:
      offense_group: [VIOLENT]
    multiplier: 0.85
    applies_to:
      max_term: always
      min_term: always
  - name: standard_term_reduction
    description: 35% reduction for every other offense
    multiplier: 0.65
    applies_to:
      max_term: always
      min_term: always
