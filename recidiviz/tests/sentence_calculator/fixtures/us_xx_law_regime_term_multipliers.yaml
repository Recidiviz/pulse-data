# yaml-language-server: $schema=../../../sentence_calculator/rules/schema/law_regime_schema.json
state_code: US_XX
description: Test regime that reduces terms with multipliers.
effective_date: "2020-01-01"

term_multipliers:
  - name: category_e_term_reduction
    description: 50% reduction for category E offenses
    when:
      offense_category: E
    multiplier: 0.5
  - name: standard_term_reduction
    description: 35% reduction for every other offense
    multiplier: 0.65
