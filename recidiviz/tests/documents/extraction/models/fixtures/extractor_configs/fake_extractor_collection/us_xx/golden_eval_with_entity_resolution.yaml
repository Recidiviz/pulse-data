# The minimal config plus a golden_eval.entity_resolution block naming the
# US_XX__ER tab shared by the collection's entity groups.
extractor_collection_name: FAKE_EXTRACTOR_COLLECTION

launch_env: LOCAL_ONLY

input_document_collection_name: FAKE_INPUT_NOTES

golden_eval:
  first_order:
    source_sheet_uri: "https://docs.google.com/spreadsheets/d/abc123"
    accuracy_thresholds:
      unit: 1.0
      sample: 0.9
  entity_resolution:
    source_sheet_uri: "https://docs.google.com/spreadsheets/d/abc123#gid=2"
    accuracy_thresholds:
      unit: 1.0
      sample: 0.9

document_metadata_filter_query_template: |
  SELECT document_contents_id FROM `{input_document_collection_metadata_address}`

prompt_vars:
  agency_name: "the Department of Fictional Affairs"
