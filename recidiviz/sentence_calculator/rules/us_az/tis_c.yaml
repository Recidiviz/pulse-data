# yaml-language-server: $schema=../schema/law_regime_schema.json
description: >-
  Arizona Truth in Sentencing, third period: offenses committed on or after
  2001-08-09. One day of earned release credit for every six days served,
  release to community supervision up to 90 days before the earned release
  credit date, and community supervision of one seventh of the term.
# TODO(OBT-56089): ADCRR's Time Computation Unit has not confirmed whether the second
# Truth in Sentencing period ends 2001-08-08 or 2001-08-18. Move this date to
# 2001-08-19 if it is the later one.
effective_date: "2001-08-09"
# Arizona counts a term in calendar days from the date it starts, which is the
# method ADCRR's electronic calculation uses rather than the worksheet's 30-day
# months.
use_calendar_term_conversion: true

# A multiplier scales the term down to the days actually served in custody.
# With one day of credit for every six days served, a person serves six
# sevenths of the term, so the multiplier is 6/7. It stands in for a credit
# rate of one per six, which the schema cannot express yet.
# For a sentence with no discipline, the day-by-day calculation serves
# ceil(6/7 of the term) days. The engine truncates the multiplied term, and
# 0.857142857 is just under 6/7, so every release credit date from this
# stand-in falls one day before the day-by-day date.
# TODO(OBT-56088): Replace the stand-in with a credit rate of 1 day for every 6 days
# served once the engine can read one, and confirm with ADCRR whether ACIS rounds
# the days served up or down.
term_multipliers:
  - name: flat_time_no_credits
    description: >-
      A flat-time sentence earns no release credits, so the full term is
      served.
    when:
      condition: flat_time
    multiplier: 1.0
    applies_to:
      max_term: always
      min_term: always
  - name: one_for_six_release_credits
    description: >-
      One day of earned release credit for every six days served. The term is
      complete once six sevenths of it is served, so the multiplier is 6/7.
    multiplier: 0.857142857
    applies_to:
      max_term: always
      min_term: always
    statute: ARS 41-1604.07

# Dates for a single sentence with no discipline. earliest_start_date, the
# sentence's start date, is its sentencing date, and adjusted_max_days is the
# term after the multiplier above less the jail credit.
# TODO(OBT-56088): The community supervision term (one seventh of the sentence) and
# the community supervision end date wait on the engine producing durations as
# well as dates.
projected_dates:
  sentence_begin_date:
    description: >-
      Sentence Begin Date (SBD): the sentencing date less the jail credit the
      court awarded.
    formula: earliest_start_date - jail_credit_days

  sentence_expiration_date:
    description: >-
      Sentence Expiration Date (SED): the full term counted from the SBD.
    formula: sentence_begin_date + unadjusted_max_days

  earned_release_credit_date_without_temporary_release:
    description: >-
      Earned Release Credit Date (ERCD) when the person is not released early
      to community supervision: the SBD plus the days served once the release
      credits are exhausted.
    formula: earliest_start_date + adjusted_max_days

  # TODO(OBT-56088): This date applies only when the person is eligible for
  # temporary release. Until the formulas can read a person-level eligibility
  # flag, every sentence gets this date.
  community_supervision_begin_date:
    description: >-
      Community Supervision Begin Date (CSBD): the temporary release date, 90
      days of release credit before the ERCD. Release credits stop at release,
      so this date is 90 times 6/7, or 77 days, before the ERCD computed
      without temporary release.
    formula: earned_release_credit_date_without_temporary_release - 77

  earned_release_credit_date:
    description: >-
      Earned Release Credit Date (ERCD) with temporary release: 90 days after
      the CSBD.
    formula: community_supervision_begin_date + 90
