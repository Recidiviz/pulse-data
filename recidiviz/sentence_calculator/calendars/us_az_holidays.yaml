# Arizona state holidays, 2024 through 2030, on the day the state observes
# them: a holiday on a Saturday is observed the Friday before, one on a Sunday
# the Monday after. Release dates that fall on a weekend or one of these days
# move to a workday. A release date in a year outside the covered range is an
# error rather than a date with no holidays, so extend the range before the
# calculation needs it.
# TODO(OBT-56089): Replace with the holiday list ADCRR's Time Computation Unit uses,
# which may differ from the state's list, and confirm how a holiday next to a
# weekend is handled.
covers:
  first_year: 2024
  last_year: 2030
holidays:
