# yaml-language-server: $schema=./../../../store/yaml_schema/schema.json
description: >
  Supervision contact notes from Colorado Department of Corrections officers
  documenting interactions with people on supervision, including office visits,
  home visits, phone calls, and other contact types.

root_entity_id_type: person_external_id

document_metadata_columns:
  - name: contact_date
    is_document_primary_key: true
    field_type: DATE
    description: The date of the contact
  - name: contact_time
    is_document_primary_key: true
    field_type: STRING
    description: The time of the contact
  - name: contact_type
    is_document_primary_key: true
    field_type: STRING
    description: The type of contact (EOMIS CONTACTTYPE)
  - name: contact_method
    field_type: STRING
    description: Method of contact (e.g., in-person, phone)
  - name: employment_status
    field_type: STRING
    description: Employment status recorded during contact (EOMIS EMPLOYMENTSTATUS)

document_generation_query: |
  SELECT
    OFFENDERID AS person_external_id,
    'US_CO_OFFENDERID' AS person_external_id_type,
    DATE(CONTACTDATE) AS contact_date,
    CONTACTTIME AS contact_time,
    CONTACTTYPE AS contact_type,
    CONTACTMETHOD AS contact_method,
    EMPLOYMENTSTATUS AS employment_status,
    CONTACTCOMMENTS AS document_text,
    TIMESTAMP(CONTACTDATE) AS document_update_datetime
  FROM `{project_id}.us_co_raw_data_up_to_date_views.eomis_supervisioncontact_latest`
  WHERE CONTACTCOMMENTS IS NOT NULL
    AND TRIM(CONTACTCOMMENTS) != ''
