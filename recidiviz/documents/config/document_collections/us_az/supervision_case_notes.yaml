# yaml-language-server: $schema=./../../../store/yaml_schema/schema.json
description: >
  Supervision case notes from US_AZ ADCRR documenting interactions, assessments,
  and case management activities for people on supervision. Uses the same
  CASE_NOTE table as facilities but filtered to supervision episodes via DPP_ID.

document_descriptor:
  singular: supervision contact note
  plural: supervision contact notes

root_entity_id_type: person_external_id

document_metadata_columns:
  - name: case_note_id
    is_document_primary_key: true
    field_type: STRING
    description: The unique identifier for the case note (CASE_NOTE_ID)
  - name: note_type_id
    field_type: STRING
    description: Foreign key to lookup table for note type
  - name: dpp_id
    field_type: STRING
    description: Foreign key to the supervision episode (DPP_EPISODE)

document_generation_query: |
  SELECT
    PERSON_ID AS person_external_id,
    'US_AZ_PERSON_ID' AS person_external_id_type,
    CASE_NOTE_ID AS case_note_id,
    NOTE_TYPE_ID AS note_type_id,
    DPP_ID AS dpp_id,
    COALESCE(note_text, xnote_text, '') AS document_text,
    TIMESTAMP(CREATE_DTM) AS document_update_datetime
  FROM `{project_id}.us_az_raw_data_up_to_date_views.CASE_NOTE_latest`
  WHERE ((note_text IS NOT NULL AND TRIM(note_text) != '')
     OR (xnote_text IS NOT NULL AND TRIM(xnote_text) != ''))
    AND COALESCE(entered_in_error, 'N') != 'Y'
    AND DPP_ID IS NOT NULL
