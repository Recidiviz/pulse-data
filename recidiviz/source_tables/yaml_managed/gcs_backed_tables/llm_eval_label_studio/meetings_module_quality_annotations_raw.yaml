address:
  dataset_id: label_studio
  table_id: meetings_module_quality_annotations_raw
description:
  Raw Label Studio annotation exports for the meetings_module_quality task.
  GCS-backed external table reading directly from the label-studio export bucket.
  Auto-generated from recidiviz/llm_eval/label_studio/config/meetings_module_quality.yaml
  — do not edit manually.
schema:
  - name: id
    type: INTEGER
    mode: NULLABLE
    description: Label Studio annotation ID.
  - name: created_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the annotation was submitted.
  - name: lead_time
    type: FLOAT
    mode: NULLABLE
    description: Time in seconds the annotator spent on the task.
  - name: was_cancelled
    type: BOOLEAN
    mode: NULLABLE
    description: Whether the annotation was cancelled rather than submitted.
  - name: completed_by
    type: RECORD
    mode: NULLABLE
    description: Annotator who completed this annotation.
    fields:
      - name: email
        type: STRING
        mode: NULLABLE
        description: Email address of the annotator.
  - name: task
    type: RECORD
    mode: NULLABLE
    description: The Label Studio task this annotation belongs to.
    fields:
      - name: id
        type: INTEGER
        mode: NULLABLE
        description: Label Studio task ID.
      - name: inner_id
        type: INTEGER
        mode: NULLABLE
        description: Task sequence number within the Label Studio project.
      - name: data
        type: RECORD
        mode: NULLABLE
        description: Task input data fields.
        fields:
          - name: state_code
            type: STRING
            mode: NULLABLE
            description: State this annotation belongs to.
          - name: meta
            type: JSON
            mode: NULLABLE
            description: Raw metadata JSON object attached to the task.
          - name: meeting_id
            type: STRING
            mode: NULLABLE
            description: Unique identifier for the meeting.
          - name: audio
            type: STRING
            mode: NULLABLE
            description: GCS URI of the audio recording.
          - name: transcript_assemblyai
            type: STRING
            mode: NULLABLE
            description: Transcript generated by AssemblyAI.
          - name: transcript_deepgram
            type: STRING
            mode: NULLABLE
            description: Transcript generated by Deepgram.
          - name: transcript_best_provider
            type: STRING
            mode: NULLABLE
            description: Which provider produced the best transcript.
          - name: transcript_best_confidence
            type: FLOAT
            mode: NULLABLE
            description: Confidence score of the best transcript.
          - name: case_note
            type: STRING
            mode: NULLABLE
            description: LLM-generated case note.
          - name: action_items
            type: JSON
            mode: NULLABLE
            description: LLM-extracted action items.
          - name: critical_updates
            type: STRING
            mode: NULLABLE
            description: LLM-extracted critical updates.
  - name: result
    type: RECORD
    mode: REPEATED
    description: Annotation result items, one per annotated field.
    fields:
      - name: type
        type: STRING
        mode: NULLABLE
        description: Label Studio result type (e.g. choices, textarea).
      - name: from_name
        type: STRING
        mode: NULLABLE
        description: Name of the annotated field.
      - name: value
        type: RECORD
        mode: NULLABLE
        description: The annotated value.
        fields:
          - name: choices
            type: STRING
            mode: REPEATED
            description: Selected choices for choice-type fields.
          - name: text
            type: STRING
            mode: REPEATED
            description: Text value for textarea-type fields.
external_data_configuration:
  sourceUris:
    - gs://{project_id}-label-studio/meetings/*
  sourceFormat: NEWLINE_DELIMITED_JSON
  ignoreUnknownValues: true
  compression: NONE
