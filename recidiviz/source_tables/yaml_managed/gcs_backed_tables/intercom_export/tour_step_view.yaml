address:
  dataset_id: intercom_export
  table_id: tour_step_view
description:
  Intercom product tour events - tracks user interactions with product
  tours
schema:
  - name: receipt_id
    type: INTEGER
    mode: NULLABLE
  - name: step_id
    type: INTEGER
    mode: NULLABLE
  - name: viewed_at
    type: TIMESTAMP
    mode: NULLABLE
  - name: update_datetime
    type: TIMESTAMP
    mode: NULLABLE
clustering_fields: null
external_data_configuration:
  sourceUris:
    - gs://{project_id}-intercom-export/outbound-content/*/tour_step_view.csv
  sourceFormat: CSV
  compression: NONE
  ignoreUnknownValues: false
  csvOptions:
    fieldDelimiter: ","
    skipLeadingRows: "1"
    quote: '"'
    encoding: UTF-8
