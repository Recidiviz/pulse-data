address:
  dataset_id: intercom_export
  table_id: open
description: Intercom content open events - tracks when users open messages
schema:
  - name: receipt_id
    type: INTEGER
    mode: NULLABLE
  - name: opened_at
    type: TIMESTAMP
    mode: NULLABLE
  - name: update_datetime
    type: TIMESTAMP
    mode: NULLABLE
clustering_fields: null
external_data_configuration:
  sourceUris:
    - gs://{project_id}-intercom-export/outbound-content/*/open.csv
  sourceFormat: CSV
  compression: NONE
  ignoreUnknownValues: false
  csvOptions:
    fieldDelimiter: ","
    skipLeadingRows: "1"
    quote: '"'
    encoding: UTF-8
