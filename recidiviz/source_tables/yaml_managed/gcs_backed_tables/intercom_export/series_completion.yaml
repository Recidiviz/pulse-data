address:
  dataset_id: intercom_export
  table_id: series_completion
description: Intercom series completed events
schema:
  - name: receipt_id
    type: INTEGER
    mode: NULLABLE
  - name: completed_at
    type: TIMESTAMP
    mode: NULLABLE
  - name: completion_node_ruleset_id
    type: INTEGER
    mode: NULLABLE
  - name: update_datetime
    type: TIMESTAMP
    mode: NULLABLE
clustering_fields: null
external_data_configuration:
  sourceUris:
    - gs://{project_id}-intercom-export/outbound-content/*/series_completion.csv
  sourceFormat: CSV
  compression: NONE
  ignoreUnknownValues: false
  csvOptions:
    fieldDelimiter: ","
    skipLeadingRows: "1"
    quote: '"'
    encoding: UTF-8
