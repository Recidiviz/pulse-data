address:
  dataset_id: intercom_export
  table_id: soft_bounce
description: Intercom soft bounce events
schema:
  - name: receipt_id
    type: INTEGER
    mode: NULLABLE
  - name: soft_bounced_at
    type: TIMESTAMP
    mode: NULLABLE
  - name: update_datetime
    type: TIMESTAMP
    mode: NULLABLE
clustering_fields: null
external_data_configuration:
  sourceUris:
    - gs://{project_id}-intercom-export/outbound-content/*/soft_bounce.csv
  sourceFormat: CSV
  compression: NONE
  ignoreUnknownValues: false
  csvOptions:
    fieldDelimiter: ","
    skipLeadingRows: "1"
    quote: '"'
    encoding: UTF-8
