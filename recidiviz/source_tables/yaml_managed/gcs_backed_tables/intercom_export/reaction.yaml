address:
  dataset_id: intercom_export
  table_id: reaction
description: Intercom reaction events - tracks user reaction emojis
schema:
  - name: receipt_id
    type: INTEGER
    mode: NULLABLE
  - name: reacted_at
    type: TIMESTAMP
    mode: NULLABLE
  - name: reaction
    type: STRING
    mode: NULLABLE
  - name: update_datetime
    type: TIMESTAMP
    mode: NULLABLE
clustering_fields: null
external_data_configuration:
  sourceUris:
    - gs://{project_id}-intercom-export/outbound-content/*/reaction.csv
  sourceFormat: CSV
  compression: NONE
  ignoreUnknownValues: false
  csvOptions:
    fieldDelimiter: ","
    skipLeadingRows: "1"
    quote: '"'
    encoding: UTF-8
