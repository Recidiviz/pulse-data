address:
  dataset_id: intercom_export
  table_id: contacts
description: Contains contact information from Intercom tickets
schema:
  - name: contact_id
    type: STRING
    mode: NULLABLE
  - name: intercom_external_id
    type: STRING
    mode: NULLABLE
  - name: state_code
    type: STRING
    mode: NULLABLE
  - name: name
    type: STRING
    mode: NULLABLE
  - name: email
    type: STRING
    mode: NULLABLE
  - name: update_datetime
    type: TIMESTAMP
    mode: NULLABLE
clustering_fields: null
external_data_configuration:
  sourceUris:
    - gs://{project_id}-intercom-export/*/contacts.csv
  sourceFormat: CSV
  compression: NONE
  ignoreUnknownValues: false
  csvOptions:
    fieldDelimiter: ","
    skipLeadingRows: "1"
    quote: '"'
    encoding: UTF-8
