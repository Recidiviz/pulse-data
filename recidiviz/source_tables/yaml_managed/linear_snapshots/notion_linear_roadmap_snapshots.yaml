address:
  dataset_id: linear_snapshots
  table_id: notion_linear_roadmap_snapshots
description:
  Append-only historical snapshot log combining the Notion state-initiative
  roadmap export with live Linear project and milestone data, uploaded via
  recidiviz/tools/analyst/notion_linear_roadmap_snapshot.py. Each run appends
  one row per initiative tagged with that run's snapshot_date. Query the
  analyst_data.notion_linear_roadmap_latest view for latest-snapshot-only
  rows.
schema:
  - name: initiative
    type: STRING
    mode: NULLABLE
    description: Notion "Initiative" column.
  - name: global_prio_flag
    type: STRING
    mode: NULLABLE
    description: Notion "*Global Prio Flag" column.
  - name: actual_fs_launch
    type: STRING
    mode: NULLABLE
    description: Notion "Actual FS Launch" column.
  - name: actual_l_n_ig_scoping_validation_start
    type: STRING
    mode: NULLABLE
    description: Notion "Actual L->N IG/Scoping+Validation Start" column.
  - name: actual_n_n
    type: STRING
    mode: NULLABLE
    description: Notion "Actual N->N " column.
  - name: actual_tt_launch
    type: STRING
    mode: NULLABLE
    description: Notion "Actual TT Launch" column.
  - name: all_state_prio_rank
    type: STRING
    mode: NULLABLE
    description: Notion "All State Prio Rank" column.
  - name: contract_to_data_weeks
    type: STRING
    mode: NULLABLE
    description: Notion "Contract to Data (weeks)" column.
  - name: contract_dsa_signed
    type: STRING
    mode: NULLABLE
