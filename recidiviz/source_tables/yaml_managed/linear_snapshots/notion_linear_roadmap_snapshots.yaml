  - name: teams_for_q3_2026
    type: STRING
    mode: NULLABLE
    description: Notion "Teams for Q3 2026" column.
  - name: ticket_link
    type: STRING
    mode: NULLABLE
    description: Notion "Ticket Link" column.
  - name: timeline_status
    type: STRING
    mode: NULLABLE
    description: Notion "Timeline Status" column.
  - name: upcoming_launch_review_s
    type: STRING
    mode: NULLABLE
    description: Notion "Upcoming Launch Review(s)" column.
  - name: users_have_access_to_live_tool_in_prod
    type: STRING
    mode: NULLABLE
    description: Notion "Users Have Access To Live Tool In Prod" column.
  - name: working_period
    type: STRING
    mode: NULLABLE
    description: Notion "Working Period" column.
  - name: product_growth_rollout_tracker
    type: STRING
    mode: NULLABLE
    description: Notion "🚀 Product Growth Rollout Tracker " column.
  - name: linear_project_slug_id
    type: STRING
    mode: NULLABLE
    description: slugId extracted from the Notion "Linear Project" URL column.
  - name: linear_project_id
    type: STRING
    mode: NULLABLE
    description: Linear project UUID, joined by slugId. Null if unmatched.
  - name: linear_project_name
    type: STRING
    mode: NULLABLE
    description: Linear project name, joined by slugId. Null if unmatched.
  - name: linear_project_state
    type: STRING
    mode: NULLABLE
    description: Linear project state (e.g. "started", "completed"), joined by slugId.
  - name: linear_project_start_date
    type: DATE
    mode: NULLABLE
    description: Linear project's own top-level start date (not tied to a specific launch stage).
  - name: linear_project_target_date
    type: DATE
    mode: NULLABLE
    description: Linear project's own top-level target date (not tied to a specific launch stage).
  - name: linear_project_health
    type: STRING
    mode: NULLABLE
    description: Latest project health status from Linear (e.g. "onTrack", "atRisk", "offTrack"). Null if no update has been posted.
  - name: linear_project_health_updated_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp the latest project health status was posted. Null if no update has been posted.
  - name: fsl_date
    type: DATE
    mode: NULLABLE
    description: Target date of the Linear milestone matched to the Full State Launch (FSL) stage.
  - name: fsl_milestone_name
    type: STRING
    mode: NULLABLE
    description: Name of the Linear milestone matched to the FSL stage.
  - name: tt_date
    type: DATE
    mode: NULLABLE
    description: Target date of the Linear milestone matched to the Trusted Tester (TT) launch stage.
  - name: tt_milestone_name
    type: STRING
    mode: NULLABLE
    description: Name of the Linear milestone matched to the TT stage.
  - name: partial_date
    type: DATE
    mode: NULLABLE
    description: Target date of the Linear milestone matched to the Partial launch stage.
  - name: partial_milestone_name
    type: STRING
    mode: NULLABLE
    description: Name of the Linear milestone matched to the Partial stage.
  - name: core_scoping_complete_date
    type: DATE
    mode: NULLABLE
    description: Target date of the Linear milestone matched to the Core Scoping Complete stage.
  - name: core_scoping_complete_milestone_name
    type: STRING
    mode: NULLABLE
    description: Name of the Linear milestone matched to the Core Scoping Complete stage.
  - name: snapshot_date
    type: DATE
    mode: REQUIRED
    description: Date this row was uploaded, i.e. which script run it belongs to.
  - name: upload_datetime
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp this row was uploaded.
clustering_fields:
  - snapshot_date
