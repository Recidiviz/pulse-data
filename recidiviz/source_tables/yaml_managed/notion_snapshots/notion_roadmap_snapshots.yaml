address:
  dataset_id: notion_snapshots
  table_id: notion_roadmap_snapshots
description:
  Append-only snapshot log of the Notion state-initiative roadmap, uploaded from a
  manual CSV export via recidiviz/tools/analyst/notion_roadmap_snapshot.py. Each
  run appends one row per roadmap initiative tagged with that run's snapshot_date.
  Notion date and date-time columns are parsed into DATE and DATETIME; every
  other Notion column is stored as uploaded, as a string. Query the
  analyst_data.notion_linear_roadmap_latest view for the latest Linear and Notion
  snapshots joined together.
schema:
  - name: initiative
    type: STRING
    mode: NULLABLE
    description: Notion "Initiative" column.
  - name: global_prio_flag
    type: STRING
    mode: NULLABLE
    description: Notion "*Global Prio Flag" column.
  - name: actual_fs_launch
    type: DATE
    mode: NULLABLE
    description: Notion "Actual FS Launch" column. For a date range, the range's end date.
  - name: actual_l_n_ig_scoping_validation_start
    type: DATE
    mode: NULLABLE
    description: Notion "Actual L->N IG/Scoping+Validation Start" column. For a date range, the range's end date.
  - name: actual_n_n
    type: DATE
    mode: NULLABLE
    description: Notion "Actual N->N " column. For a date range, the range's end date.
  - name: actual_tt_launch
    type: DATE
    mode: NULLABLE
    description: Notion "Actual TT Launch" column. For a date range, the range's end date.
  - name: all_state_prio_rank
    type: STRING
    mode: NULLABLE
    description: Notion "All State Prio Rank" column.
  - name: contract_to_data_weeks
    type: STRING
    mode: NULLABLE
    description: Notion "Contract to Data (weeks)" column.
  - name: contract_dsa_signed
    type: DATE
    mode: REPEATED
    description:
      Every date in the Notion "Contract/DSA Signed" column, sorted ascending. The Notion
      column can list several dates.
  - name: created_time
    type: DATETIME
    mode: NULLABLE
    description: Notion "Created time" column, in the time zone of whoever exported the CSV.
  - name: current_owner_s
    type: STRING
    mode: NULLABLE
    description: Notion "Current Owner(s)" column.
  - name: da_work_points
    type: STRING
    mode: NULLABLE
    description: Notion "DA Work Points" column.
  - name: data_analysts
    type: STRING
    mode: NULLABLE
    description: Notion "Data Analysts" column.
  - name: data_received
    type: DATE
    mode: REPEATED
    description:
      Every date in the Notion "Data Received" column, sorted ascending. The Notion
      column can list several dates.
  - name: data_to_fully_scoped_weeks
    type: STRING
    mode: NULLABLE
    description: Notion "Data to Fully Scoped (weeks)" column.
  - name: design_work_points
    type: STRING
    mode: NULLABLE
    description: Notion "Design Work Points" column.
  - name: dev_time_per_da_work_point
    type: STRING
    mode: NULLABLE
    description: Notion "Dev Time per DA Work Point" column.
  - name: exclude_from_launch_momentum
    type: STRING
    mode: NULLABLE
    description: Notion "Exclude from Launch Momentum" column.
  - name: fde_work_points
    type: STRING
    mode: NULLABLE
    description: Notion "FDE Work Points" column.
  - name: fs_launch_quarter
    type: STRING
    mode: NULLABLE
    description: Notion "FS Launch Quarter" column.
  - name: fully_scoped_to_tt_weeks
    type: STRING
    mode: NULLABLE
    description: Notion "Fully Scoped to TT (weeks)" column.
  - name: ie_work_points
    type: STRING
    mode: NULLABLE
    description: Notion "IE Work Points" column.
  - name: initiative_documentation
    type: STRING
    mode: NULLABLE
    description: Notion "Initiative Documentation" column.
  - name: last_edited_time
    type: DATETIME
    mode: NULLABLE
    description:
      Notion "Last edited time" column, in the time zone of whoever exported the
      CSV.
  - name: linear_project
    type: STRING
    mode: NULLABLE
    description: Notion "Linear Project" column (the raw Linear project URL).
  - name: opportunities
    type: STRING
    mode: NULLABLE
    description: Notion "Opportunities" column.
  - name: pg_work_points
    type: STRING
    mode: NULLABLE
    description: Notion "PG Work Points" column.
  - name: problem_statement
    type: STRING
    mode: NULLABLE
    description: Notion "Problem statement" column.
  - name: product_category
    type: STRING
    mode: NULLABLE
    description: Notion "Product Category" column.
  - name: projected_fsl
    type: STRING
    mode: NULLABLE
    description: Notion "Projected FSL" column.
  - name: projected_n_n
    type: STRING
    mode: NULLABLE
    description: Notion "Projected N->N " column.
  - name: projected_tt_launch
    type: STRING
    mode: NULLABLE
    description: Notion "Projected TT Launch" column.
  - name: q3_intra_state_prio
    type: STRING
    mode: NULLABLE
    description: Notion "Q3 Intra-State Prio" column.
  - name: risks_to_target_launch_date
    type: STRING
    mode: NULLABLE
    description: Notion "Risks to Target Launch Date" column.
  - name: roadmap_2026
    type: STRING
    mode: NULLABLE
    description: Notion "Roadmap 2026" column.
  - name: roadmap_status
    type: STRING
    mode: NULLABLE
    description: Notion "Roadmap Status" column.
  - name: swe_work_points
    type: STRING
    mode: NULLABLE
    description: Notion "SWE Work Points" column.
  - name: sanity_suggestion
    type: STRING
    mode: NULLABLE
    description: Notion "Sanity Suggestion" column.
  - name: scoped_to_fsl
    type: STRING
    mode: NULLABLE
    description: Notion "Scoped to FSL" column.
  - name: scoping_lead_s
    type: STRING
    mode: NULLABLE
    description: Notion "Scoping Lead(s)" column.
  - name: scoping_start_to_fully_scoped_weeks
    type: STRING
    mode: NULLABLE
    description: Notion "Scoping Start to Fully Scoped (weeks)" column.
  - name: scoping_work_points
    type: STRING
    mode: NULLABLE
    description: Notion "Scoping Work Points" column.
  - name: state
    type: STRING
    mode: NULLABLE
    description: Notion "State" column.
  - name: state_risk_status
    type: STRING
    mode: NULLABLE
    description: Notion "State Risk Status" column.
  - name: t_shirt_size
    type: STRING
    mode: NULLABLE
    description: Notion "T-Shirt Size" column.
  - name: tt_to_fsl_weeks
    type: STRING
    mode: NULLABLE
    description: Notion "TT to FSL (weeks)" column.
  - name: target_fsl
    type: DATE
    mode: NULLABLE
    description: Notion "Target FSL" column. For a date range, the range's end date.
  - name: target_n_n
    type: DATE
    mode: NULLABLE
    description: Notion "Target N->N" column. For a date range, the range's end date.
  - name: target_tt_launch
    type: DATE
    mode: NULLABLE
    description: Notion "Target TT Launch" column. For a date range, the range's end date.
  - name: teams_for_q3_2026
    type: STRING
    mode: NULLABLE
    description: Notion "Teams for Q3 2026" column.
  - name: ticket_link
    type: STRING
    mode: NULLABLE
    description: Notion "Ticket Link" column.
  - name: timeline_status
    type: STRING
    mode: NULLABLE
    description: Notion "Timeline Status" column.
  - name: upcoming_launch_review_s
    type: STRING
    mode: NULLABLE
    description: Notion "Upcoming Launch Review(s)" column.
  - name: users_have_access_to_live_tool_in_prod
    type: STRING
    mode: NULLABLE
    description: Notion "Users Have Access To Live Tool In Prod" column.
  - name: working_period
    type: STRING
    mode: NULLABLE
    description: Notion "Working Period" column.
  - name: product_growth_rollout_tracker
    type: STRING
    mode: NULLABLE
    description: Notion "🚀 Product Growth Rollout Tracker " column.
  - name: linear_project_slug_id
    type: STRING
    mode: NULLABLE
    description:
      slugId extracted from the Notion "Linear Project" URL column. Null if the
      initiative has no Linear Project link.
  - name: working_period_start_date
    type: DATE
    mode: NULLABLE
    description:
      First day of the Notion "Working Period" date range. Null if the initiative
      has no working period.
  - name: working_period_end_date_exclusive
    type: DATE
    mode: NULLABLE
    description:
      Day after the last day of the Notion "Working Period" date range. Notion
      shows the range's last day inclusively, so this is one day later than the
      end date shown in Notion. Null if the initiative has no working period.
  - name: snapshot_date
    type: DATE
    mode: REQUIRED
    description: Date this row was uploaded, i.e. which upload it belongs to.
  - name: upload_datetime
    type: TIMESTAMP
    mode: REQUIRED
    description: Timestamp this row was uploaded.
clustering_fields:
  - snapshot_date
