address:
  dataset_id: github_api_raw
  table_id: files
description: Append-only snapshots of the files changed by pull requests in the
  engineering metrics repos, read from the GitHub GraphQL API by
  recidiviz/entrypoints/github_metrics_crawl.py. Each crawl appends one row per
  changed file on every pull request it reads.
schema:
  - name: repository_full_name
    type: STRING
    mode: REQUIRED
    description: The repository as owner/name, for example Recidiviz/pulse-data.
  - name: pr_number
    type: INTEGER
    mode: REQUIRED
    description: The pull request number within the repository.
  - name: crawl_id
    type: STRING
    mode: REQUIRED
    description: UUID of the crawl run that wrote this row. Every row one run writes for a pull request shares it.
  - name: crawled_at
    type: TIMESTAMP
    mode: REQUIRED
    description: Start time of the crawl run that wrote this row; the partition column.
  - name: path
    type: STRING
    mode: REQUIRED
    description: Path of the changed file, relative to the repository root.
  - name: additions
    type: INTEGER
    mode: NULLABLE
    description: Lines the pull request adds to the file.
  - name: deletions
    type: INTEGER
    mode: NULLABLE
    description: Lines the pull request deletes from the file.
  - name: change_type
    type: STRING
    mode: NULLABLE
    description: How the pull request changes the file, for example ADDED, MODIFIED, DELETED or RENAMED.
  - name: raw
    type: JSON
    mode: NULLABLE
    description: The changed file node as the GitHub GraphQL API returned it.
time_partitioning:
  type: DAY
  field: crawled_at
require_partition_filter: false
