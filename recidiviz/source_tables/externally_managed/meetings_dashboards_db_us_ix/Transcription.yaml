address:
  dataset_id: meetings_dashboards_db_us_ix
  table_id: Transcription
description:
  Transcripts of meeting recordings produced by a third-party transcription
  provider, synced from the meetings backend database. One row per transcription attempt
  for a Meeting; a meeting has at most one transcription per provider.
schema:
  - name: id
    description: Unique identifier for this transcription.
    type: STRING
    mode: NULLABLE
  - name: provider
    description:
      Third-party transcription provider that produced this transcript (e.g.
      ASSEMBLYAI, DEEPGRAM).
    type: STRING
    mode: NULLABLE
  - name: transcriptObject
    description:
      JSON-encoded raw transcript response from the provider. The whole object
      is stored because other fields of the response may be useful in the future.
    type: STRING
    mode: NULLABLE
  - name: meetingId
    description: Meeting.id of the meeting this transcription belongs to.
    type: STRING
    mode: NULLABLE
  - name: confidence
    description:
      Overall confidence score reported by the transcription provider for
      this transcript.
    type: FLOAT
    mode: NULLABLE
  - name: summary
    description: Summary of the transcript, if one was generated by the provider.
    type: STRING
    mode: NULLABLE
clustering_fields: []
