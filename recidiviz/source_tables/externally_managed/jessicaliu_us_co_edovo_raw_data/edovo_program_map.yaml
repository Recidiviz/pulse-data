address:
  dataset_id: jessicaliu_us_co_edovo_raw_data
  table_id: edovo_program_map
description:
  Temporary CO Edovo course catalog, exported from a Google Sheet. Supplies
  validation signals only -- ORAS alignment and the canonical course title -- never
  credit, which comes from the content_hours the Edovo API reports per completion.
  Staging only; see TODO(OBT-39522) for the productionized source.
schema:
  - name: date_evaluated
    type: STRING
    mode: NULLABLE
  - name: content_id
    type: STRING
    mode: NULLABLE
  - name: title
    type: STRING
    mode: NULLABLE
  - name: oras_alignment_1
    type: STRING
    mode: NULLABLE
  - name: oras_alignment_2
    type: STRING
    mode: NULLABLE
  - name: oras_alignment_3
    type: STRING
    mode: NULLABLE
  - name: oras_alignment_4
    type: STRING
    mode: NULLABLE
  - name: oras_alignment_5
    type: STRING
    mode: NULLABLE
  - name: oras_recommendation
    type: STRING
    mode: NULLABLE
  - name: description
    type: STRING
    mode: NULLABLE
  - name: language
    type: STRING
    mode: NULLABLE
  - name: provider_name
    type: STRING
    mode: NULLABLE
  - name: categories
    type: STRING
    mode: NULLABLE
  - name: subjects
    type: STRING
    mode: NULLABLE
  - name: estimated_time_to_complete_minutes
    type: FLOAT
    mode: NULLABLE
clustering_fields: null
deployed_projects:
  - recidiviz-staging
