address:
  dataset_id: meetings_app_segment_metrics
  table_id: frontend_meetings_recording_discarded
description: "Segment event recording when a meeting recording is discarded (deleted without being uploaded) in the Meetings app. Raw data exported directly to BigQuery by Segment's warehouse connector, not generated by Recidiviz code."
schema:
  - name: anonymous_id
    description: "Segment-generated anonymous identifier for the user"
    type: STRING
    mode: NULLABLE
  - name: context_library_name
    description: "Name of the Segment client library"
    type: STRING
    mode: NULLABLE
  - name: context_library_version
    description: "Version of the Segment client library"
    type: STRING
    mode: NULLABLE
  - name: event
    description: "Name of the tracked event"
    type: STRING
    mode: NULLABLE
  - name: event_text
    description: "Human-readable description of the tracked event"
    type: STRING
    mode: NULLABLE
  - name: id
    description: "Unique identifier for this Segment event"
    type: STRING
    mode: NULLABLE
  - name: is_internal_user
    description: "Whether this event was triggered by an internal Recidiviz user rather than a real state partner user"
    type: BOOLEAN
    mode: NULLABLE
  - name: loaded_at
    description: "Timestamp when the record was loaded into the data warehouse"
    type: TIMESTAMP
    mode: NULLABLE
  - name: meeting_id
    description: "Unique identifier for the meeting, shared across all lifecycle events (e.g. started, paused, ended, discarded, uploaded) for that same meeting"
    type: STRING
    mode: NULLABLE
  - name: original_timestamp
    description: "Original client-side timestamp of the event"
    type: TIMESTAMP
    mode: NULLABLE
  - name: person_id
    description: "The Recidiviz internal person_id (StatePerson.person_id) of the justice-involved person the meeting concerns. Unlike most other Segment-tracked products, this is not a pseudonymized ID requiring a downstream join to resolve."
    type: STRING
    mode: NULLABLE
  - name: received_at
    description: "Timestamp when the Segment server received the event"
    type: TIMESTAMP
    mode: NULLABLE
  - name: sent_at
    description: "Timestamp when the client sent the event"
    type: TIMESTAMP
    mode: NULLABLE
  - name: timestamp
    description: "Timestamp of the event, set by Segment"
    type: TIMESTAMP
    mode: NULLABLE
  # TODO(OBT-46938): Will be updated to populate a hashed user_hash instead of a raw email address.
  - name: user_id
    description: "Authenticated user identifier. Unlike most other Segment-tracked products, the Meetings app populates this with the user's raw email address rather than a hashed user_hash."
    type: STRING
    mode: NULLABLE
  - name: uuid_ts
    description: "Timestamp used for deduplication by Segment"
    type: TIMESTAMP
    mode: NULLABLE
clustering_fields:
time_partitioning:
  type: DAY
require_partition_filter: false
