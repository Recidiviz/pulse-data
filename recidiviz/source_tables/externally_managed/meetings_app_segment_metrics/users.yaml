address:
  dataset_id: meetings_app_segment_metrics
  table_id: users
description: "Segment users table containing user traits and properties for the Meetings app. Raw data exported directly to BigQuery by Segment's warehouse connector, not generated by Recidiviz code."
schema:
  - name: context_library_name
    description: "Name of the Segment client library"
    type: STRING
    mode: NULLABLE
  - name: context_library_version
    description: "Version of the Segment client library"
    type: STRING
    mode: NULLABLE
  - name: id
    description: "Unique identifier for this Segment event"
    type: STRING
    mode: NULLABLE
  - name: is_internal_user
    description: "Whether this event was triggered by an internal Recidiviz user rather than a real state partner user"
    type: BOOLEAN
    mode: NULLABLE
  - name: loaded_at
    description: "Timestamp when the record was loaded into the data warehouse"
    type: TIMESTAMP
    mode: NULLABLE
  - name: received_at
    description: "Timestamp when the Segment server received the event"
    type: TIMESTAMP
    mode: NULLABLE
  - name: uuid_ts
    description: "Timestamp used for deduplication by Segment"
    type: TIMESTAMP
    mode: NULLABLE
  - name: context_app_build
    description: "Build number of the app"
    type: STRING
    mode: NULLABLE
  - name: context_app_name
    description: "Name of the app"
    type: STRING
    mode: NULLABLE
  - name: context_app_namespace
    description: "Bundle identifier/namespace of the app"
    type: STRING
    mode: NULLABLE
  - name: context_app_version
    description: "Version of the app"
    type: STRING
    mode: NULLABLE
  - name: context_device_id
    description: "Unique identifier for the device"
    type: STRING
    mode: NULLABLE
  - name: context_device_manufacturer
    description: "Manufacturer of the device"
    type: STRING
    mode: NULLABLE
  - name: context_device_model
    description: "Model of the device"
    type: STRING
    mode: NULLABLE
  - name: context_device_name
    description: "Name of the device"
    type: STRING
    mode: NULLABLE
  - name: context_device_type
    description: "Type of the device (e.g. desktop, mobile)"
    type: STRING
    mode: NULLABLE
  - name: context_instance_id
    description: "UUID generated by the Segment client library to identify this app instance/session, used to distinguish concurrent instances during dedup"
    type: STRING
    mode: NULLABLE
  - name: context_ip
    description: "IP address of the client"
    type: STRING
    mode: NULLABLE
  - name: context_locale
    description: "Locale setting of the client"
    type: STRING
    mode: NULLABLE
  - name: context_network_cellular
    description: "Whether the device was connected via a cellular network"
    type: BOOLEAN
    mode: NULLABLE
  - name: context_network_wifi
    description: "Whether the device was connected via wifi"
    type: BOOLEAN
    mode: NULLABLE
  - name: context_os_name
    description: "Name of the device operating system"
    type: STRING
    mode: NULLABLE
  - name: context_os_version
    description: "Version of the device operating system"
    type: STRING
    mode: NULLABLE
  - name: context_screen_height
    description: "Height of the device screen in pixels"
    type: INTEGER
    mode: NULLABLE
  - name: context_screen_width
    description: "Width of the device screen in pixels"
    type: INTEGER
    mode: NULLABLE
  - name: context_timezone
    description: "Timezone of the client"
    type: STRING
    mode: NULLABLE
clustering_fields:
time_partitioning:
  type: DAY
  requirePartitionFilter: false
require_partition_filter: false
