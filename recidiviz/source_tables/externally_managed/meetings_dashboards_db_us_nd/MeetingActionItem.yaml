address:
  dataset_id: meetings_dashboards_db_us_nd
  table_id: MeetingActionItem
description: >
  Action items for a meeting, synced from the meetings backend database. One
  row per action item, either generated by the notetaking pipeline or added
  by hand by a staff member. Staff edits to action items are recorded on
  these rows (editedTask, deleted, deletedAt) rather than on the legacy
  Meeting.actionItems column.
schema:
  - name: id
    description: Unique identifier for this action item.
    type: STRING
    mode: NULLABLE
  - name: meetingId
    description: Meeting.id of the meeting this action item belongs to.
    type: STRING
    mode: NULLABLE
  - name: assignee
    description: >
      Who is responsible for completing this action item (e.g. Client, Staff
      Member, Third Party).
    type: STRING
    mode: NULLABLE
  - name: createdAt
    description: Timestamp when this action item was created.
    type: TIMESTAMP
    mode: NULLABLE
  - name: completed
    description: Whether a staff member has marked this action item as completed.
    type: BOOLEAN
    mode: NULLABLE
  - name: editedTask
    description: >
      The staff member's edited version of generatedTask, or null if the task
      text was never edited.
    type: STRING
    mode: NULLABLE
  - name: generatedTask
    description: >
      Task text for this action item as originally written, by the notetaking
      pipeline or by the staff member who added the item by hand.
    type: STRING
    mode: NULLABLE
  - name: evidenceQuotes
    description: >
      Quotes from the meeting transcript that support this action item,
      encoded as a Postgres array literal (e.g. {"first quote","second quote"}).
    type: STRING
    mode: NULLABLE
  - name: deleted
    description: Whether a staff member deleted this action item.
    type: BOOLEAN
    mode: NULLABLE
  - name: deletedAt
    description: Timestamp when a staff member deleted this action item, if deleted.
    type: TIMESTAMP
    mode: NULLABLE
  - name: pipelineRunId
    description: >
      NotetakingPipelineRun.id of the run that generated this action item. Null
      when a staff member added the item by hand.
    type: STRING
    mode: NULLABLE
  - name: context
    description: >
      The notetaking pipeline's reasoning for why this action item was
      generated, if provided.
    type: STRING
    mode: NULLABLE
clustering_fields: null
