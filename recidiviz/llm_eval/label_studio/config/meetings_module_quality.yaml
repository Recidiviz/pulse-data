task_name: "meetings_module_quality"
description: >
  Meetings module quality: human annotators grade the accuracy of LLM-generated
  meeting summaries, transcripts, and extracted action items.
labelstudio_project_ids:
  recidiviz-123: 1
  recidiviz-staging: 2
gcs_export_prefix: "meetings"
task_import_source_uri: "gs://{project_id}-meetings-audio-data/*label-studio-task.json"
task_import_path_contains: "label-studio-task.json"

# US_DEMO is demo data staged into the same bucket. It matches the path shape of a real
# meeting but is nobody's labeling work, so it must not land in the coverage denominator.
task_import_path_excludes:
  - "/US_DEMO/"

# Import objects are named {state_code}/{meeting_id}/label-studio-task.json, and the payload
# grew these two keys over time: the oldest objects carry neither, later ones carry only
# meeting_id, and current ones carry both. Without the path as a fallback, every object
# predating meeting_id extracts an all-NULL key and the whole set collapses into one phantom
# task, and every object predating state_code leaves the view unable to scope by state.
# Where both sources are present they agree on every object in the bucket.
task_import_path_field_segments:
  state_code: 0
  meeting_id: 1
task_import_source_project_mapping:
  recidiviz-staging: recidiviz-dashboard-staging
  recidiviz-123: recidiviz-dashboard-production

primary_key_fields:
  - "meeting_id"

task_data_fields:
  - column_name: "state_code"
    description: "State this annotation belongs to."
    bq_type: "STRING"
  - column_name: "meta"
    description: "Raw metadata JSON object attached to the task."
    bq_type: "STRING"
    extract_as_json: true
  - column_name: "meeting_id"
    description: "Unique identifier for the meeting."
    bq_type: "STRING"
  - column_name: "audio"
    description: "GCS URI of the audio recording."
    bq_type: "STRING"
  - column_name: "transcript_assemblyai"
    description: "Transcript generated by AssemblyAI."
    bq_type: "STRING"
  - column_name: "transcript_deepgram"
    description: "Transcript generated by Deepgram."
    bq_type: "STRING"
  - column_name: "transcript_best_provider"
    description: "Which provider produced the best transcript."
    bq_type: "STRING"
  - column_name: "transcript_best_confidence"
    description: "Confidence score of the best transcript."
    bq_type: "FLOAT64"
  - column_name: "case_note"
    description: "LLM-generated case note."
    bq_type: "STRING"
  - column_name: "action_items"
    description: "LLM-extracted action items."
    bq_type: "STRING"
    extract_as_json: true
  - column_name: "critical_updates"
    description: "LLM-extracted critical updates."
    bq_type: "STRING"

annotation_fields:
  - column_name: "transcript_quality"
    description: "Rating of the transcript's accuracy."
    ls_type: "choices"
    bq_type: "STRING"
    transform: "choices_single_select"
    irr_included: true
    ordinal_values:
      - "BAD"
      - "PARTIAL"
      - "GOOD"

  - column_name: "transcript_quality_notes"
    description: "Annotator notes on transcript quality issues."
    ls_type: "textarea"
    bq_type: "STRING"
    transform: "textarea_text"

  - column_name: "transcript_better"
    description: "Which transcript provider produced the better result."
    ls_type: "choices"
    bq_type: "STRING"
    transform: "choices_single_select"

  - column_name: "case_note_accuracy"
    description: "Rating of the case note's accuracy."
    ls_type: "choices"
    bq_type: "STRING"
    transform: "choices_single_select"
    irr_included: true
    ordinal_values:
      - "BAD"
      - "PARTIAL"
      - "GOOD"

  - column_name: "case_note_notes"
    description: "Annotator notes on case note accuracy issues."
    ls_type: "textarea"
    bq_type: "STRING"
    transform: "textarea_text"

  - column_name: "action_items_accuracy"
    description: "Rating of the extracted action items' accuracy."
    ls_type: "choices"
    bq_type: "STRING"
    transform: "choices_single_select"
    irr_included: true
    ordinal_values:
      - "BAD"
      - "PARTIAL"
      - "GOOD"

  - column_name: "action_items_notes"
    description: "Annotator notes on action items accuracy issues."
    ls_type: "textarea"
    bq_type: "STRING"
    transform: "textarea_text"

  - column_name: "critical_updates_accuracy"
    description: "Rating of the extracted critical updates' accuracy."
    ls_type: "choices"
    bq_type: "STRING"
    transform: "choices_single_select"
    irr_included: true
    ordinal_values:
      - "BAD"
      - "PARTIAL"
      - "GOOD"

  - column_name: "critical_updates_notes"
    description: "Annotator notes on critical updates accuracy issues."
    ls_type: "textarea"
    bq_type: "STRING"
    transform: "textarea_text"

  - column_name: "overall_grade"
    description: "Overall quality grade for all LLM outputs for this meeting."
    ls_type: "choices"
    bq_type: "STRING"
    transform: "choices_single_select"
    irr_included: true
    ordinal_values:
      - "BAD"
      - "PARTIAL"
      - "GOOD"

  - column_name: "overall_notes"
    description: "Annotator notes on overall quality."
    ls_type: "textarea"
    bq_type: "STRING"
    transform: "textarea_text"
