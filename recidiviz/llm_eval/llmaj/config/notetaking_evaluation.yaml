task_name: "notetaking_evaluation"
description: >
  LLMAJ (LLM-as-judge) evaluation of the notetaking module's outputs: case
  notes, action items, critical updates, and transcript comparison. One row per
  pipeline run evaluated. Grade values are GOOD, PARTIAL, or BAD.

source_dataset: "meetings_dashboards_db_export"
source_table: "NotetakingEvaluationRun_materialized"

# Non-JSON columns passed through from the source table.
metadata_fields:
  - column_name: "id"
    source_column_name: "id"
    bq_type: "STRING"
    description: "Unique identifier for this evaluation run."
  - column_name: "created_at"
    source_column_name: "createdAt"
    bq_type: "TIMESTAMP"
    description: "Timestamp when the evaluation run was created."
  - column_name: "pipeline_run_id"
    source_column_name: "pipelineRunId"
    bq_type: "STRING"
    description: "Identifier of the notetaking pipeline run this evaluation covers."
  - column_name: "evaluator_version"
    source_column_name: "evaluatorVersion"
    bq_type: "STRING"
    description: "Version string of the LLMAJ evaluator that produced this run."
  - column_name: "langsmith_trace_id"
    source_column_name: "langsmithTraceId"
    bq_type: "STRING"
    description: "LangSmith trace ID for debugging the evaluator run."

# Fields extracted from the scores JSON column.
scores_fields:
  # overall
  - column_name: "overall_grade"
    json_path: "$.overall.grade"
    bq_type: "STRING"
    description: "Overall quality grade across all notetaking outputs (GOOD/PARTIAL/BAD)."
  - column_name: "overall_rationale"
    json_path: "$.overall.rationale"
    bq_type: "STRING"
    description: "Evaluator rationale for the overall grade."
  - column_name: "overall_omissions"
    json_path: "$.overall.omissions"
    bq_type: "STRING"
    mode: "REPEATED"
    description: "Omissions identified in the overall evaluation."
  - column_name: "overall_hallucinations"
    json_path: "$.overall.hallucinations"
    bq_type: "STRING"
    mode: "REPEATED"
    description: "Hallucinations identified in the overall evaluation."

  # caseNote
  - column_name: "case_note_grade"
    json_path: "$.caseNote.grade"
    bq_type: "STRING"
    description: "Quality grade for the LLM-generated case note (GOOD/PARTIAL/BAD)."
  - column_name: "case_note_rationale"
    json_path: "$.caseNote.rationale"
    bq_type: "STRING"
    description: "Evaluator rationale for the case note grade."
  - column_name: "case_note_omissions"
    json_path: "$.caseNote.omissions"
    bq_type: "STRING"
    mode: "REPEATED"
    description: "Omissions identified in the case note evaluation."
  - column_name: "case_note_hallucinations"
    json_path: "$.caseNote.hallucinations"
    bq_type: "STRING"
    mode: "REPEATED"
    description: "Hallucinations identified in the case note evaluation."

  # actionItems
  - column_name: "action_items_grade"
    json_path: "$.actionItems.grade"
    bq_type: "STRING"
    description: "Quality grade for the LLM-extracted action items (GOOD/PARTIAL/BAD)."
  - column_name: "action_items_rationale"
    json_path: "$.actionItems.rationale"
    bq_type: "STRING"
    description: "Evaluator rationale for the action items grade."
  - column_name: "action_items_omissions"
    json_path: "$.actionItems.omissions"
    bq_type: "STRING"
    mode: "REPEATED"
    description: "Omissions identified in the action items evaluation."
  - column_name: "action_items_hallucinations"
    json_path: "$.actionItems.hallucinations"
    bq_type: "STRING"
    mode: "REPEATED"
    description: "Hallucinations identified in the action items evaluation."

  # transcriptComparison
  - column_name: "transcript_comparison_winner"
    json_path: "$.transcriptComparison.winner"
    bq_type: "STRING"
    description: "Which transcript provider won the comparison
      (ASSEMBLYAI/DEEPGRAM/SINGLE_PROVIDER/ABOUT_THE_SAME/NONE)."
  - column_name: "transcript_comparison_rationale"
    json_path: "$.transcriptComparison.rationale"
    bq_type: "STRING"
    description: "Evaluator rationale for the transcript comparison result."
  - column_name: "transcript_comparison_deepgram_grade"
    json_path: "$.transcriptComparison.deepgramGrade"
    bq_type: "STRING"
    description: "Quality grade for the Deepgram transcript (GOOD/PARTIAL/BAD/NONE)."
  - column_name: "transcript_comparison_assembly_ai_grade"
    json_path: "$.transcriptComparison.assemblyAiGrade"
    bq_type: "STRING"
    description: "Quality grade for the AssemblyAI transcript (GOOD/PARTIAL/BAD/NONE)."
