steps:
  # The agent searches a checkout of the repo at ${_REPO_BRANCH}, which can
  # differ from the `main` checkout that `source_to_build` puts in /workspace.
  - name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -c
      - git clone --depth=1 --branch=${_REPO_BRANCH} https://x-access-token:$$GITHUB_TOKEN@github.com/Recidiviz/pulse-data.git /workspace/repo
    secretEnv: [GITHUB_TOKEN]
    id: clone

  # The agent runs inside the main application image, which already contains
  # the recidiviz package and its dependencies. The staging release build
  # trigger builds that image on every push to main; each staging deploy tags
  # it `default:latest` (see tag_images.py).
  - name: us-docker.pkg.dev/$PROJECT_ID/appengine/default:latest
    dir: /app/
    entrypoint: sh
    args:
      - -c
      - uv run python -m recidiviz.tools.claude_workflows.pg_ticket_diagnosis.run_pg_ticket_diagnosis
    env:
      - "HOME=/home/recidiviz"
      - "ISSUE_NUMBER=${_ISSUE_NUMBER}"
      - "ISSUE_TITLE=${_ISSUE_TITLE}"
      - "ISSUE_BODY=${_ISSUE_BODY}"
      - "ISSUE_REPO=${_ISSUE_REPO}"
      - "GCP_PROJECT_ID=$PROJECT_ID"
      - "GOOGLE_CLOUD_PROJECT=$PROJECT_ID"
      - "RECIDIVIZ_ENV=staging"
      - "BUILD_ID=$BUILD_ID"
      - "REPO_PATH=/workspace/repo"
      - "BQ_PROJECT=$PROJECT_ID"
      - "FORCE_RERUN=${_FORCE_RERUN}"
      - "PRODUCT_AREAS=${_PRODUCT_AREAS}"
    secretEnv: [ANTHROPIC_API_KEY]
    id: run

# The Linear API key (linear_deploy_script_api_key) is NOT injected here: the
# run step reads it directly from Secret Manager via get_secret using the build
# SA, the same way it reads github_deploy_script_pat for helperbot comments. It
# only needs the SA's secretAccessor grant (setup_gcp.sh), not env injection.
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/pg_diagnosis_claude_api_key/versions/latest
      env: ANTHROPIC_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/github_deploy_script_pat/versions/latest
      env: GITHUB_TOKEN

substitutions:
  _ISSUE_NUMBER: ""
  _ISSUE_TITLE: ""
  _ISSUE_BODY: ""
  # Should match recidiviz.github.github_client.RECIDIVIZ_DATA_REPO.
  _ISSUE_REPO: "Recidiviz/pulse-data"
  _REPO_BRANCH: "main"
  _FORCE_RERUN: ""
  _PRODUCT_AREAS: ""

# No `serviceAccount` here: it's set on the Cloud Build trigger
# (pg-diagnosis-trigger.tf), which inlines these steps via `yamldecode`.
# Specifying a service account in both the trigger and the build config is
# rejected by Cloud Build. `logging: CLOUD_LOGGING_ONLY` below is still
# required because the trigger runs the build as a custom service account.
options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
