# Details of production-ready pipeline jobs to deploy to templates. These templates will be deployed both to staging and
# production buckets.
#
# If you want to deploy a pipeline just to stage, add the `staging_only: True` attribute to the pipeline

# When adding a new template, visit go/dataflow-region-cpu-usage-metrics and go/dataflow-region-quotas
# to determine which region has the most capacity for a new pipeline.
# When choosing a machine type, note that c4a machines tend to be higher performance than c4d.
# For pipelines that require less processing power, e.g. supplemental or population_span metrics, choose c4d

# NOTE: Machine Type zonal availability can vary, and there is no guarantee that a machine is available across
# all zones within a region depending on Google Cloud's rollout. The machine type must be available in the
# state's region in DEFAULT_PIPELINE_REGIONS_BY_STATE_CODE (recidiviz/pipelines/ingest/activity/pipeline_utils.py).

# To list the zones where a given machine type is available, run:
# $ gcloud compute machine-types list --filter="name=c4a-highcpu-32" | grep "us-"
# Snapshot as of 2026-07-08 (us- regions):
# c4a-highcpu-32  us-central1-a / -b / -c / -f
# c4a-highcpu-32  us-east1-b / -c / -d
# c4a-highcpu-32  us-east4-a / -b / -c
# c4a-highcpu-32  us-east5-a / -b / -c
# c4a-highcpu-32  us-south1-a / -b
# c4a-highcpu-32  us-west1-a / -c        (NOTE: NOT available in us-west1-b)
# c4a-highcpu-32  us-west2-a / -b / -c
# c4a-highcpu-32  us-west4-a / -b / -c

# $ gcloud compute machine-types list --filter="name=c4d-highcpu-32" | grep "us-"
# Snapshot as of 2026-07-08 (us- regions):
# c4d-highcpu-32  us-central1-a / -b / -c / -f
# c4d-highcpu-32  us-east1-b / -c / -d
# c4d-highcpu-32  us-east4-a / -b / -c
# c4d-highcpu-32  us-east5-a / -b / -c
# c4d-highcpu-32  us-west1-a / -b / -c
# c4d-highcpu-32  us-west3-a
# c4d-highcpu-32  us-west4-a / -b / -c
# (NOTE: c4d is NOT available in us-south1 or us-west2)

# List of pipelines with their necessary details
metric_pipelines:
  # Full US_NY calculations with no time limit
  - pipeline: population_span_metrics
    state_code: US_NY
    metric_types: INCARCERATION_POPULATION_SPAN
