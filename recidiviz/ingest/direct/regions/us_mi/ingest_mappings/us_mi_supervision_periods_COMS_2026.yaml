# yaml-language-server: $schema=./../../../ingest_mappings/yaml_schema/1.0.0/schema.json
# This file associates the columns outputted from the query in `view_state_persons` to the corresponding
# Ingest Object fields.
manifest_language: 1.0.0
launch_env:
  $env: feature__coms_2026_enabled
input_columns:
  offender_number: STRING
  period_start: DATETIME
  period_end: DATETIME
  Movement_Code_Description_start_reason: STRING
  Movement_Code_Description_end_reason: STRING
  Movement_To: STRING
  Movement_To_Type: STRING
  COMS_supervision_level: STRING
  supervision_schedule_value: STRING
  coms_employee_id: STRING
  modifiers_list: STRING
  specialties_list: STRING
  statuses: STRING
  status_start_reasons: STRING
  status_end_reasons: STRING
  period_id: INTEGER
  Region: STRING
  Work_Unit: STRING
unused_columns: []
variables:
  - supervision_level_concatenated:
      $concat:
        $values:
          - COMS_supervision_level
          - $literal("_")
          - supervision_schedule_value
          - $literal("##")
          - specialties_list
        $separator: ""
output:
  StatePerson:
    external_ids:
      - StatePersonExternalId:
          external_id: offender_number
          id_type: $literal("US_MI_DOC")
    supervision_periods:
      - StateSupervisionPeriod:
          external_id:
            $concat:
              $values:
                - $literal("COMS")
                - offender_number
                - period_id
              $include_nulls: True
          supervision_type:
            $conditional:
              # If the COMS supervision level or modifiers data indicates a special supervision type case
              - $if:
                  $custom:
                    $function: us_mi_custom_parsers.supervision_type_info_from_COMS
                    $args:
                      supervision_level: $variable(supervision_level_concatenated)
                      modifier: modifiers_list
                $then:
                  $enum_mapping:
                    $raw_text:
                      $concat:
                        $values:
                          - $literal("SUPERVISION LEVEL-")
                          - $variable(supervision_level_concatenated)
                          - $literal("##MODIFIERS-")
                          - modifiers_list
                        $separator: ""
                    $custom_parser: us_mi_custom_enum_parsers.map_supervision_type_based_on_COMS_level_modifier
              # Else, if not one of the special cases, parse supervision type based on supervision status from COMS
              - $else_if:
                  $not_null: statuses
                $then:
                  $enum_mapping:
                    $raw_text:
                      $concat:
                        $values:
                          - $literal("SUPERVISION STATUS-")
                          - statuses
                        $separator: ""
                    $custom_parser: us_mi_custom_enum_parsers.map_supervision_type_based_on_COMS_status
              - $else: $literal_enum(StateSupervisionPeriodSupervisionType.INTERNAL_UNKNOWN)
          start_date: period_start
          termination_date: period_end
          county_code: Region
          supervision_site: Work_Unit
          admission_reason:
            $conditional:
              # if the status start reasons say whether this is parole or probation, map based on that
              - $if:
                  $custom:
                    $function: us_mi_custom_parsers.can_map_admission_reason_from_COMS_status_start
                    $args:
                      status_start_reasons: status_start_reasons
                $then:
                  $enum_mapping:
                    $raw_text: status_start_reasons
                    $custom_parser: us_mi_custom_enum_parsers.map_admission_reason_based_on_COMS_status_start
              - $else_if:
                  $not_null: Movement_Code_Description_start_reason
                $then:
                  $enum_mapping:
                    $raw_text: Movement_Code_Description_start_reason
                    $mappings:
                      StateSupervisionPeriodAdmissionReason.ABSCONSION:
                        - "Absconder from Parole"
                        - "Absconder from Probation"
                        - "Escape from MDOC"
                        - "Escape after Release to Outside Agency"
                      StateSupervisionPeriodAdmissionReason.COURT_SENTENCE:
                        - "Court Resentenced to Probation"
                      StateSupervisionPeriodAdmissionReason.INVESTIGATION:
                        - "Intake"
                        - "New Commitment - Murder 1st Pending Sentence"
                      StateSupervisionPeriodAdmissionReason.RELEASE_FROM_INCARCERATION:
                        - "Paroled  "
                        - "Paroled in Custody"
                        - "Reinstated on Parole "
                        - "Discharged - From Prison on Max - Transfer for Probation"
                        - "Discharged - From Prison Under HYTA & Continued on Probation"
                      StateSupervisionPeriodAdmissionReason.RETURN_FROM_ABSCONSION:
                        - "Reinstated on Parole - While at Large/No Parole Revocation "
                        - "Returned - Escaper Returned to the Institution"
                      StateSupervisionPeriodAdmissionReason.RETURN_FROM_SUSPENSION:
                        - "Reparoled While on Same Term"
                        - "Reinstated on Probation"
                        - "Returned - From Court"
                        - "Returned - From Temporary Release"
                        - "Returned - Other Criminal Justice Agencies"
                        - "Returned - As Parole Technical Rule Violator - Violation Sustained"
                        - "Returned - While on Parole Pending Revocation Hearing"
                      StateSupervisionPeriodAdmissionReason.TRANSFER_FROM_OTHER_JURISDICTION:
                        - "Transferred Back to Michigan"
                        - "Transferred Out of State"
                      StateSupervisionPeriodAdmissionReason.TRANSFER_WITHIN_STATE:
                        - "Transfer Between Offices in Michigan"
                        - "Transfer Between Facilities"
                        - "Held Under Custody"
                        - "Held Under Custody - Probationer"
                        - "Overnight Transfer Hold"
                      StateSupervisionPeriodAdmissionReason.INTERNAL_UNKNOWN:
                        - "New Commitment - SAI Only"
                        - "New Commitment - Probation Technical Violator"
                        - "New Commitment - Probationer w/ New Sentence"
                        - "New Commitment"
                        - "New Commitment - Parole Viol. w/ New Sentence"
                        - "New Commitment - Escaper w/ New Sentence"
                        - "New Commitment - While Under Sentence"
                        - "New Commitment - HYTA Prisoner"
                        - "Returned - To Court from Bond"
                        - "Death on Temporary Release"
                        - "Death in Institution"
                        - "Death on Parole"
                        - "Death on Escape"
                        - "Death on Probation"
                        - "Interstate Compact Case - Rejected for Supervision"
                        - "Interstate Compact Transfer Request Rescinded"
                        - "Interest Closed for Interstate Order"
                        - "Temporary Release - Outside Hospital"
                        - "Failure To Appear For Sentencing"
                        - "Conviction Reversed by Court"
                        - "Discharged - Court - Nolle Prosequi"
                        - "Discharged - Court Discharged with Time Served"
                        - "Discharged - Transfer to Foreign Country"
                        - "Released - To Court on Writ"
                        - "Discharged - On the Maximum"
                        - "Discharged - From Parole"
                        - "Discharged - Early from Parole"
                        - "Discharged - Administratively from Parole"
                        - "Released - Court Released on Bond"
                        - "Released - Other Criminal Justice Agencies"
                        - "Discharged - Administrative Discharge from Probation"
                        - "Dismissed by Court"
                        - "Discharged - From Prison Under HYTA Without Probation"
                        - "Discharged - From Probation"
                        - "Discharged - Probation Revoked"
                        - "Discharged - From Probation Without Improvement"
                        - "Discharged - Early Discharge from Probation"
                        - "Discharged - Pardoned"
                        - "Discharged - From Probation While Absconder"
                        - "Sentenced to Jail Only"
                        - "Sentenced to Monetary Only Sentence"
                        - "Sentenced to Juvenile Supervision"
                        - "Supervision Transferred to District Court"
              - $else: $literal_enum(StateSupervisionPeriodAdmissionReason.TRANSFER_WITHIN_STATE)
          termination_reason:
            $conditional:
              # if there is a status end reason, map based on that
              - $if:
                  $not_null: status_end_reasons
                $then:
                  $enum_mapping:
                    $raw_text: status_end_reasons
                    $custom_parser: us_mi_custom_enum_parsers.map_termination_reason_based_on_COMS_status_end
              # if this is a return from absconsion situation
              - $else_if:
                  $and:
                    - $custom:
                        $function: us_mi_custom_parsers.has_absconsion_or_escape_modifier
                        $args:
                          modifiers_list: modifiers_list
                    - $in:
                        $value: Movement_Code_Description_end_reason
                        $options:
                          - $literal("Held Under Custody")
                          - $literal("Reinstated on Probation")
                          - $literal("Held Under Custody - Probationer")
                          - $literal("Reinstated on Parole - While at Large/No Parole Revocation ")
                          - $literal("Paroled  ")
                          - $literal("Paroled in Custody")
                          - $literal("Reinstated on Parole ")
                          - $literal("Reparoled While on Same Term")
                $then: $literal_enum(StateSupervisionPeriodTerminationReason.RETURN_FROM_ABSCONSION)
              # TODO(MI-14) Check how transfer out of states are captured in movements and whether we still need
              #        extra TRANSFER_TO_OTHER_JURISDICTION mapping
              # else map based on Movement_Code_Description_end_reason
              - $else_if:
                  $not_null: Movement_Code_Description_end_reason
                $then:
                  $enum_mapping:
                    $raw_text: Movement_Code_Description_end_reason
                    $mappings:
                      StateSupervisionPeriodTerminationReason.ABSCONSION:
                        - "Absconder from Parole"
                        - "Absconder from Probation"
                        - "Escape from MDOC"
                        - "Escape after Release to Outside Agency"
                      StateSupervisionPeriodTerminationReason.ADMITTED_TO_INCARCERATION:
                        - "New Commitment"
                        - "New Commitment - HYTA Prisoner"
                        - "New Commitment - While Under Sentence"
                        - "New Commitment - SAI Only"
                      StateSupervisionPeriodTerminationReason.DEATH:
                        - "Death on Parole"
                        - "Death on Probation"
                        - "Death in Institution"
                        - "Death on Escape"
                        - "Death on Temporary Release"
                      StateSupervisionPeriodTerminationReason.DISCHARGE:
                        - "Discharged - Administratively from Parole"
                        - "Discharged - Administrative Discharge from Probation"
                        - "Discharged - From Probation While Absconder"
                        - "Discharged - Early from Parole"
                        - "Discharged - Early Discharge from Probation"
                        - "Discharged - Court Discharged with Time Served"
                        - "Sentenced to Jail Only"
                        - "Sentenced to Monetary Only Sentence"
                        - "Discharged - From Prison Under HYTA Without Probation"
                      StateSupervisionPeriodTerminationReason.EXPIRATION:
                        - "Discharged - From Parole"
                        - "Discharged - From Probation"
                        - "Discharged - From Probation Without Improvement"
                        - "Discharged - On the Maximum"
                      StateSupervisionPeriodTerminationReason.INVESTIGATION:
                        - "Intake"
                      StateSupervisionPeriodTerminationReason.RETURN_FROM_ABSCONSION:
                        - "Reinstated on Parole - While at Large/No Parole Revocation "
                        - "Reinstated on Parole "
                      StateSupervisionPeriodTerminationReason.REVOCATION:
                        - "New Commitment - Escaper w/ New Sentence"
                        - "New Commitment - Parole Viol. w/ New Sentence"
                        - "New Commitment - Probationer w/ New Sentence"
                        - "New Commitment - Probation Technical Violator"
                        - "Returned - As Parole Technical Rule Violator - Violation Sustained"
                        - "Discharged - Probation Revoked"
                      StateSupervisionPeriodTerminationReason.SUSPENSION:
                        - "Released - Other Criminal Justice Agencies"
                        - "Returned - To Court from Bond"
                        - "Temporary Release - Outside Hospital"
                        - "Held Under Custody"
                        - "Held Under Custody - Probationer"
                      StateSupervisionPeriodTerminationReason.TRANSFER_TO_OTHER_JURISDICTION:
                        - "Discharged - Transfer to Foreign Country"
                        - "Transferred Out of State"
                        - "Supervision Transferred to District Court"
                        - "Released - To Court on Writ"
                        - "Interstate Compact Case - Rejected for Supervision"
                        - "Interstate Compact Transfer Request Rescinded"
                      StateSupervisionPeriodTerminationReason.TRANSFER_WITHIN_STATE:
                        - "Transfer Between Offices in Michigan"
                        - "Paroled  "
                        - "Reinstated on Probation"
                        - "Paroled in Custody"
                        - "Transferred Back to Michigan"
                        - "Reparoled While on Same Term"
                        - "Court Resentenced to Probation"
                        - "Discharged - From Prison Under HYTA & Continued on Probation"
                        - "Discharged - From Prison on Max - Transfer for Probation"
                      StateSupervisionPeriodTerminationReason.VACATED:
                        - "Dismissed by Court"
                        - "Conviction Reversed by Court"
                        - "Discharged - Court - Nolle Prosequi"
                      StateSupervisionPeriodTerminationReason.INTERNAL_UNKNOWN:
                        - "Failure To Appear For Sentencing"
              - $else_if:
                  $not_null: period_end
                $then: $literal_enum(StateSupervisionPeriodTerminationReason.TRANSFER_WITHIN_STATE)
          supervision_level:
            $conditional:
              # If this period has a in custody related modifier, map to IN_CUSTODY
              - $if:
                  $custom:
                    $function: us_mi_custom_parsers.has_in_custody_modifier
                    $args:
                      modifiers_list: modifiers_list
                $then: $literal_enum(StateSupervisionLevel.IN_CUSTODY)
              # Map supervision level to Absconsion if the modifier indicates absconsion
              - $else_if:
                  $custom:
                    $function: us_mi_custom_parsers.has_absconded_modifier
                    $args:
                      modifiers_list: modifiers_list
                $then: $literal_enum(StateSupervisionLevel.ABSCONSION)
              # TODO(MI-14): Check if we still need to map periods with an in custody related supervision site (like jail) -- hopefully not with modifiers
              # Leaves supervision_level NULL when neither COMS level column has a value.
              - $else_if:
                  $or:
                    - $not_null: COMS_supervision_level
                    - $not_null: supervision_schedule_value
                $then:
                  $enum_mapping:
                    $raw_text: $variable(supervision_level_concatenated)
                    $custom_parser: us_mi_custom_enum_parsers.parse_supervision_level
          supervising_officer_staff_external_id: coms_employee_id
          supervising_officer_staff_external_id_type:
            $conditional:
              - $if:
                  $not_null: coms_employee_id
                $then: $literal("US_MI_OMNI_USER")
          custodial_authority:
            $conditional:
              # If this has custodial authority info in the COMS modifier or supervision level info
              - $if:
                  $custom:
                    $function: us_mi_custom_parsers.custodial_authority_info_from_COMS
                    $args:
                      supervision_level: $variable(supervision_level_concatenated)
                      modifier: modifiers_list
                $then:
                  $enum_mapping:
                    $raw_text:
                      $concat:
                        $values:
                          - $literal("SUPERVISION LEVEL-")
                          - $variable(supervision_level_concatenated)
                          - $literal("##MODIFIER-")
                          - modifiers_list
                        $separator: ""
                    $custom_parser: us_mi_custom_enum_parsers.map_custodial_authority_based_on_COMS
              # TODO(MI-14): Sub in COMS equivalent when we get real data
              - $else_if:
                  $equal:
                    - Movement_To_Type
                    - $literal("2155")
                $then: $literal_enum(StateCustodialAuthority.OTHER_STATE)
              # TODO(MI-14): Sub in COMS equivalent when we get real data
              - $else_if:
                  $in:
                    $value: Movement_To
                    $options:
                      - $literal("UNITED STATES MARSHALLS")
                      - $literal("US Marshal Service")
                      - $literal("Outside MDOC Jurisdiction")
                $then:
                  $enum_mapping:
                    $raw_text: Movement_To
                    $mappings:
                      StateCustodialAuthority.FEDERAL:
                        - "UNITED STATES MARSHALLS"
                        - "US Marshal Service"
                      StateCustodialAuthority.INTERNAL_UNKNOWN:
                        - "Outside MDOC Jurisdiction"
              - $else: $literal_enum(StateCustodialAuthority.SUPERVISION_AUTHORITY)
