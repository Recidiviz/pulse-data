# yaml-language-server: $schema=./../../../ingest_mappings/yaml_schema/1.0.0/schema.json
# This file associates the columns outputted from the query in `view_person` to the corresponding
# Ingest Object fields.
manifest_language: 1.0.0
input_columns:
  FIRST_NAME: STRING
  LAST_NAME: STRING
  NYSID: STRING
  BOOKCASENUMBER: STRING
unused_columns: []
output:
  StatePerson:
    external_ids:
      - StatePersonExternalId:
          external_id: NYSID
          id_type: $literal("US_NYC_NYSID")
      - StatePersonExternalId:
          external_id: BOOKCASENUMBER
          id_type: $literal("US_NYC_BOOKCASENUMBER")
    full_name:
      $person_name:
        $given_names: FIRST_NAME
        $surname: LAST_NAME
