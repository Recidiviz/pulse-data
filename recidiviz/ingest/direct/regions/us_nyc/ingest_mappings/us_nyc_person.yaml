# yaml-language-server: $schema=./../../../ingest_mappings/yaml_schema/1.0.0/schema.json
# This file associates the columns outputted from the query in `view_person` to the corresponding
# Ingest Object fields.
manifest_language: 1.0.0
input_columns:
  NYSID: STRING
  FIRST_NAME: STRING
  LAST_NAME: STRING
  CURRENT_BOOKCASENUMBER: STRING
  FIRST_BOOKCASENUMBER: STRING
  BOOKCASENUMBER_LIST: STRING
  NAME_LIST: STRING
unused_columns: []
output:
  StatePerson:
    external_ids:
      - StatePersonExternalId:
          external_id: NYSID
          id_type: $literal("US_NYC_NYSID")
      - $foreach:
          $iterable: BOOKCASENUMBER_LIST
          $result:
            StatePersonExternalId:
              external_id: $iter_item
              id_type: $literal("US_NYC_BOOKCASENUMBER")
              is_current_display_id_for_type:
                $equal:
                  - $iter_item
                  - CURRENT_BOOKCASENUMBER
              is_stable_id_for_type:
                $equal:
                  - $iter_item
                  - FIRST_BOOKCASENUMBER
    full_name:
      $person_name:
        $given_names: FIRST_NAME
        $surname: LAST_NAME
    aliases:
      - $foreach:
          $iterable:
            $split_json: NAME_LIST
          $result:
            StatePersonAlias:
              alias_type: $literal_enum(StatePersonAliasType.INTERNAL_UNKNOWN)
              full_name:
                $person_name:
                  $given_names:
                    $json_extract:
                      $key: alias_first
                      $json: $iter_item
                  $surname:
                    $json_extract:
                      $key: alias_last
                      $json: $iter_item
