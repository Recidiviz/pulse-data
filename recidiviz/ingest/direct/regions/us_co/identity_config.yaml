# yaml-language-server: $schema=./../../../../pipelines/ingest/identity/yaml_schema/schema.json
# Per-person-type configuration for the US_CO identity ingest pipeline. For
# details on allowed configuration, see the schema file referenced above; for
# the code defaults, see identity_ingest_pipeline_config.py.
jii:
  max_ids_per_type_overrides: {}
staff:
  # No overrides: eomis_staff is one row per party record and
  # eomis_staff_badges aggregates each badge's party records onto the badge's
  # single row, so every id value lands on exactly one fragment per view.
  max_ids_per_type_overrides: {}
