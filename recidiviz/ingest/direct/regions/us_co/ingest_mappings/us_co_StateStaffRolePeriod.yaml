# yaml-language-server: $schema=./../../../ingest_mappings/yaml_schema/1.0.0/schema.json
# This file associates the columns outputted from the query in `StateStaffRolePeriod`
# to the corresponding Ingest Object fields.
manifest_language: 1.0.0
input_columns:
  stable_PARTYID: STRING
  period_id: INTEGER
  WORKASSIGNMENT: STRING
  start_date: DATE
  end_date_exclusive: DATE
unused_columns: []
output:
  StateStaff:
    external_ids:
      - StateStaffExternalId:
          external_id: stable_PARTYID
          id_type: $literal("US_CO_PARTYID")
    role_periods:
      - StateStaffRolePeriod:
          external_id:
            $concat:
              $values:
                - stable_PARTYID
                - period_id
          start_date: start_date
          end_date: end_date_exclusive
          role_type:
            $enum_mapping:
              $raw_text: WORKASSIGNMENT
              $custom_parser: us_co_custom_enum_parsers.parse_staff_role_type
          role_subtype:
            $enum_mapping:
              $raw_text: WORKASSIGNMENT
              $custom_parser: us_co_custom_enum_parsers.parse_staff_role_subtype
