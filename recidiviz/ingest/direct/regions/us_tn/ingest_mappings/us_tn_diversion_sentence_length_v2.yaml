# yaml-language-server: $schema=./../../../ingest_mappings/yaml_schema/1.0.0/schema.json
# This file associates the columns outputted from the query in
# `view_diversion_sentence_length_v2` to the same StateSentenceLength shape
# as `us_tn_diversion_sentence_length.yaml` (TOMIS 1.0).
manifest_language: 1.0.0
launch_env:
  $env: is_local # TODO(TN-1945): change this to feature__tomis_2_0_enabled
input_columns:
  OffenderID: STRING
  PERSON_ID: STRING

  # Form the unique ID for sentences. Must match view_diversion_sentence_v2.py.
  ConvictionCounty: STRING
  CaseYear: STRING
  CaseNumber: STRING
  CountNumber: STRING
  DIVERSION_OFFENSE_ID: STRING

  LastUpdateDate: DATE
  ExpirationDate: DATE

unused_columns: []
variables:
  - sentence_external_id:
      $concat:
        $separator: "@@"
        $values:
          - OffenderID
          - ConvictionCounty
          - CaseYear
          - CaseNumber
          - CountNumber
          - DIVERSION_OFFENSE_ID
          - $literal("DIVERSION")
output:
  StatePerson:
    external_ids:
      - StatePersonExternalId:
          external_id: PERSON_ID
          id_type: $literal("US_TN_PERSON_ID")
      - $conditional:
          - $if:
              $not_null: OffenderID
            $then:
              StatePersonExternalId:
                external_id: OffenderID
                id_type: $literal("US_TN_DOC")
    sentences:
      - StateSentence:
          external_id: $variable(sentence_external_id)
          sentence_lengths:
            - StateSentenceLength:
                length_update_datetime: LastUpdateDate
                # Diversion sentences have a single ExpirationDate with no
                # min/max distinction. We map to max since that is what
                # downstream criteria reference.
                projected_completion_date_max_external: ExpirationDate
