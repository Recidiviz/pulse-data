# yaml-language-server: $schema=./../../../ingest_mappings/yaml_schema/1.0.0/schema.json
manifest_language: 1.0.0
input_columns:
  StaffID: STRING
  Status: STRING
  SiteID: STRING
  Start_Date: DATETIME
  StaffTitle: STRING
  End_Date: DATETIME
  StatusChangeOrder: INTEGER
unused_columns:
  - Status
output:
  StateStaff:
    external_ids:
      - StateStaffExternalId:
          external_id: StaffID
          id_type: $literal("US_TN_STAFF_TOMIS")
    role_periods:
      - $conditional:
          - $if:
              $and:
                - $not_null: Start_Date
                - $custom:
                    $function: us_tn_custom_parsers.role_period_is_included_given_tomis_2_0_status
                    $args:
                      start_date: Start_Date
                      tomis_2_0_enabled:
                        $env: feature__tomis_2_0_enabled
            $then:
              StateStaffRolePeriod:
                external_id:
                  $concat:
                    $values:
                      - StaffID
                      - StatusChangeOrder
                start_date: Start_Date
                end_date:
                  $custom:
                    $function: us_tn_custom_parsers.end_date_for_tomis_2_0_status
                    $args:
                      end_date: End_Date
                      tomis_2_0_enabled:
                        $env: feature__tomis_2_0_enabled
                role_type:
                  $enum_mapping:
                    $raw_text: StaffTitle
                    $custom_parser: us_tn_custom_enum_parsers.staff_role_type_from_staff_title
                role_subtype:
                  $enum_mapping:
                    $raw_text: StaffTitle
                    $custom_parser: us_tn_custom_enum_parsers.staff_role_subtype_from_staff_title
    location_periods:
      - $conditional:
          - $if:
              $not_null: Start_Date
            $then:
              StateStaffLocationPeriod:
                external_id:
                  $concat:
                    $values:
                      - StaffID
                      - StatusChangeOrder
                start_date: Start_Date
                end_date: End_Date
                location_external_id:
                  $concat:
                    $values:
                      - SiteID
