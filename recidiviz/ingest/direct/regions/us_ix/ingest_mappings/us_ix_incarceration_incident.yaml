# yaml-language-server: $schema=./../../../ingest_mappings/yaml_schema/1.0.0/schema.json
# This file associates the columns outputted from the query in `view_IncarcerationIncident` to
#  corresponding Ingest Object fields.
manifest_language: 1.0.0
input_columns:
  IncidentExternalId: STRING
  TermId: STRING
  OffenderId: STRING
  InfractionDate: STRING
  DorOffenseTypeDesc: STRING
  DorOffenseTypeName: STRING
  DorOffenseCode: STRING
  DorOffenseCategoryId: STRING
  LocationName: STRING
  SeverityDesc: STRING
  DAProcedureStatusDesc: STRING
  IncidentDetails: STRING
  DACaseId: STRING
  DAHearingDate: STRING
  IsDismissed: BOOLEAN
  IsPending: BOOLEAN
  outcome_list: STRING
unused_columns: []
output:
  StatePerson:
    external_ids:
      - StatePersonExternalId:
          external_id: OffenderId
          id_type: $literal("US_IX_DOC")
    incarceration_incidents:
      - StateIncarcerationIncident:
          external_id: IncidentExternalId
          incident_date: InfractionDate
          facility: LocationName
          incident_severity:
            $enum_mapping:
              $raw_text:
                $custom:
                  $function: us_ix_custom_parsers.parse_dor_offense_class
                  $args:
                    offense_code: DorOffenseCode
              $mappings:
                StateIncarcerationIncidentSeverity.HIGHEST:
                  - A
                StateIncarcerationIncidentSeverity.SECOND_HIGHEST:
                  - B
                StateIncarcerationIncidentSeverity.THIRD_HIGHEST:
                  - C
                StateIncarcerationIncidentSeverity.FOURTH_HIGHEST:
                  # Informal resolution offense codes (I01, I02, ...)
                  - I
                StateIncarcerationIncidentSeverity.INTERNAL_UNKNOWN:
                  # Numeric offense codes (100-899), last used in 2017
                  - "1"
                  - "2"
                  - "3"
                  - "4"
                  - "5"
                  - "6"
                  - "7"
                  - "8"
          incident_type:
            $enum_mapping:
              $raw_text: DorOffenseTypeDesc
              $custom_parser: us_ix_custom_enum_parsers.map_incident_type
          incident_details: IncidentDetails
          incident_metadata:
            $json_dict:
              IncidentDetails: IncidentDetails
              ProcedureStatus: DAProcedureStatusDesc
              HearingDate: DAHearingDate
              OffenseTypeName: DorOffenseTypeName
              DACaseId: DACaseId
              TermId: TermId
              OffenseCode: DorOffenseCode
              Severity: SeverityDesc
              OffenseCategoryId: DorOffenseCategoryId
          incarceration_incident_outcomes:
            - $foreach:
                $iterable:
                  $split_json: outcome_list
                $result:
                  StateIncarcerationIncidentOutcome:
                    external_id:
                      $json_extract:
                        $key: penalty_id
                        $json: $iter_item
                    outcome_type:
                      $enum_mapping:
                        $raw_text:
                          $json_extract:
                            $key: penalty_name
                            $json: $iter_item
                        $custom_parser: us_ix_custom_enum_parsers.map_incarceration_incident_outcome_type
                    date_effective:
                      $json_extract:
                        $key: penalty_start
                        $json: $iter_item
                    projected_end_date:
                      $json_extract:
                        $key: penalty_end
                        $json: $iter_item
                    hearing_date:
                      $json_extract:
                        $key: hearing_date
                        $json: $iter_item
                    report_date:
                      $json_extract:
                        $key: insert_date
                        $json: $iter_item
            # A DOR that was dismissed or overturned, or whose DA case hasn't been
            # decided yet, gets one DISMISSED or PENDING outcome alongside any
            # penalties, so downstream logic can tell those DORs apart. It is keyed on
            # the incident because an overturned report can have no DA case.
            - $conditional:
                - $if:
                    $or:
                      - $equal:
                          - IsDismissed
                          - $literal("True")
                      - $equal:
                          - IsPending
                          - $literal("True")
                  $then:
                    StateIncarcerationIncidentOutcome:
                      external_id:
                        $concat:
                          $values:
                            - $literal("STATUS")
                            - IncidentExternalId
                      outcome_type:
                        $conditional:
                          - $if:
                              $equal:
                                - IsDismissed
                                - $literal("True")
                            $then: $literal_enum(StateIncarcerationIncidentOutcomeType.DISMISSED)
                          - $else: $literal_enum(StateIncarcerationIncidentOutcomeType.PENDING)
                      outcome_description: DAProcedureStatusDesc
                      hearing_date: DAHearingDate
