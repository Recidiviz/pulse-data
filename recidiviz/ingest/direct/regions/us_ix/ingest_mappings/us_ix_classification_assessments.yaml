# yaml-language-server: $schema=./../../../ingest_mappings/yaml_schema/1.0.0/schema.json
# This file associates the columns outputted from the query in `view_oras_assessment_weekly_v2` to the corresponding
# Ingest Object fields.
manifest_language: 1.0.0
input_columns:
  ClassificationId: STRING
  OffenderId: STRING
  AdministrativeDutyOfficerId: STRING
  ClassificationTypeDesc: STRING
  ScoreSheetTypeId: STRING
  AssessmentDate: STRING
  score: STRING
  section_one_score: STRING
  section_two_score: STRING
  section_three_score: STRING
  ScoredSecurityLevel: STRING
  OverrideReason: STRING
  OverrideSecurityLevel: STRING
unused_columns:
  - ScoreSheetTypeId
output:
  StatePerson:
    external_ids:
      - StatePersonExternalId:
          external_id: OffenderId
          id_type: $literal("US_IX_DOC")
    assessments:
      - StateAssessment:
          external_id: ClassificationId
          assessment_date: AssessmentDate
          # IX records no approval step; a completed RSLS took effect on its
          # AssessmentDate.
          assessment_decision:
            $conditional:
              - $if:
                  $not_null: AssessmentDate
                $then: $literal_enum(StateAssessmentDecision.APPROVED)
          assessment_decision_date: AssessmentDate
          conducting_staff_external_id: AdministrativeDutyOfficerId
          conducting_staff_external_id_type:
            $conditional:
              - $if:
                  $not_null: AdministrativeDutyOfficerId
                $then: $literal("US_IX_EMPLOYEE")
          assessment_class: $literal_enum(StateAssessmentClass.RISK)
          assessment_type: $literal_enum(StateAssessmentType.RSLS)
          assessment_subtype:
            $enum_mapping:
              $raw_text: ClassificationTypeDesc
              $mappings:
                StateAssessmentSubtype.INITIAL:
                  - "Initial"
                  # A rider classification is done on entering the retained
                  # jurisdiction program, so it's the initial classification for
                  # that stay. A person committed to a term after a rider can
                  # therefore have two INITIAL classifications in one stay.
                  - "Rider"
                StateAssessmentSubtype.REASSESSMENT:
                  - "Scheduled"
                  - "Administrative"
          assessment_score: score
          assessment_level:
            $enum_mapping:
              $raw_text: ScoredSecurityLevel
              $mappings:
                StateAssessmentLevel.MINIMUM:
                  - "Minimum"
                StateAssessmentLevel.MEDIUM:
                  - "Medium"
                StateAssessmentLevel.MEDIUM_HIGH:
                  - "Close"
                StateAssessmentLevel.INTERNAL_UNKNOWN:
                  - "2"
                  - "5"
                  - "6"
                  - "Community"
                  - "Death Row"
                  - "Field Unit"
                  - "Hearing Impaired"
                  - "Jail"
                  - "Life-Death"
                  - "Protective Custody"
                  - "Rider"
                  - "Segregation"
                  - "Transition"
                  - "Unassigned"
                  - "Work center"
          assessment_override_reason: OverrideReason
          assessment_override_level:
            $conditional:
              - $if:
                  $not_null: OverrideReason
                $then:
                  $enum_mapping:
                    $raw_text: OverrideSecurityLevel
                    $mappings:
                      StateAssessmentLevel.MINIMUM:
                        - "Minimum"
                      StateAssessmentLevel.MEDIUM:
                        - "Medium"
                      StateAssessmentLevel.MEDIUM_HIGH:
                        - "Close"
                      StateAssessmentLevel.INTERNAL_UNKNOWN:
                        - "2"
                        - "5"
                        - "6"
                        - "Community"
                        - "Death Row"
                        - "Field Unit"
                        - "Hearing Impaired"
                        - "Jail"
                        - "Life-Death"
                        - "Protective Custody"
                        - "Rider"
                        - "Segregation"
                        - "Transition"
                        - "Unassigned"
                        - "Work center"
          assessment_metadata:
            $normalized_values_json_dict:
              CLASSIFICATIONTYPE: ClassificationTypeDesc
              SECTIONONESCORE: section_one_score
              SECTIONTWOSCORE: section_two_score
              SECTIONTHREESCORE: section_three_score
