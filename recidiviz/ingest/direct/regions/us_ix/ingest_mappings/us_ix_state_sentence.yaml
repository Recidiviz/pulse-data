# yaml-language-server: $schema=./../../../ingest_mappings/yaml_schema/1.0.0/schema.json
manifest_language: 1.0.0
input_columns:
  SentenceId: STRING
  OffenderId: STRING
  CountyId: STRING
  SentenceDate: DATE
  CorrectionsCompactEndDate: DATE
  CorrectionsCompactStartDate: DATE
  OffenseSentenceTypeName: STRING
  inState: STRING
  TermId: STRING
  SentenceOrderTypeId: STRING
  parent_sentence_external_id_array: STRING
  SentenceDetailUpdateDate: STRING
  SegmentEndDate: DATE
  SegmentPED: DATE
  SegmentMaxYears: STRING
  SegmentMaxMonths: STRING
  SegmentMaxDays: STRING
  SegmentYears: STRING
  SegmentMonths: STRING
  SegmentDays: STRING
  projected_completion_date_max: DATE
unused_columns: []
output:
  StatePerson:
    external_ids:
      - StatePersonExternalId:
          external_id: OffenderId
          id_type: $literal("US_IX_DOC")
    sentences:
      - StateSentence:
          county_code: CountyId
          imposed_date:
            $conditional:
              - $if:
                  $not_null: SentenceDate
                $then: SentenceDate
              - $else: CorrectionsCompactStartDate
          sentencing_authority:
            $conditional:
              - $if:
                  $not_null: inState
                $then:
                  $enum_mapping:
                    $raw_text: inState
                    $custom_parser: us_ix_custom_enum_parsers.parse_sentencing_authority
          is_life: # UPDATED: uses OffenseSentenceTypeId though Idaho warns of data quality issues with life sentences rn
            $conditional:
              - $if:
                  $in:
                    $value: OffenseSentenceTypeName
                    $options:
                      - $literal("Life with parole")
                      - $literal("Life without parole")
                $then: $literal_bool(True)
              - $else:
                  $custom:
                    $function: us_ix_custom_parsers.parse_is_life_from_date
                    $args:
                      proj_completion_date: CorrectionsCompactEndDate
          external_id: SentenceId # Never null in scl_Sentence table
          parent_sentence_external_id_array: parent_sentence_external_id_array
          sentence_lengths:
            # A few sentences have no scl_SentenceDetail row, so no update datetime.
            - $conditional:
                - $if:
                    $not_null: SentenceDetailUpdateDate
                  $then:
                    StateSentenceLength:
                      # One row per sentence, so this is the current length, not a series.
                      length_update_datetime: SentenceDetailUpdateDate
                      projected_completion_date_max_external: projected_completion_date_max
                      # SegmentEndDate is the sentence start plus its minimum length.
                      projected_completion_date_min_external: SegmentEndDate
                      parole_eligibility_date_external: SegmentPED
                      sentence_length_days_max:
                        $conditional:
                          - $if:
                              $or:
                                - $not_null: SegmentMaxYears
                                - $not_null: SegmentMaxMonths
                                - $not_null: SegmentMaxDays
                            $then:
                              $custom:
                                $function: us_ix_custom_parsers.max_and_min_lengths_days
                                $args:
                                  years_str: SegmentMaxYears
                                  months_str: SegmentMaxMonths
                                  days_str: SegmentMaxDays
                      sentence_length_days_min:
                        $conditional:
                          - $if:
                              $or:
                                - $not_null: SegmentYears
                                - $not_null: SegmentMonths
                                - $not_null: SegmentDays
                            $then:
                              $custom:
                                $function: us_ix_custom_parsers.max_and_min_lengths_days
                                $args:
                                  years_str: SegmentYears
                                  months_str: SegmentMonths
                                  days_str: SegmentDays
          sentence_type:
            $enum_mapping:
              $raw_text: SentenceOrderTypeId
              $mappings:
                StateSentenceType.STATE_PRISON:
                  - "1" # Commitment
                  - "2" # Retained Jurisdiction
                  - "3" # Corrections Compact
                StateSentenceType.PROBATION:
                  - "4" # Drug Court
                  - "5" # Suspended Sentence
                  - "6" # Withheld Judgment
                  - "7" # Unsupervised Probation
          sentence_group_external_id: TermId
          is_capital_punishment:
            $conditional:
              - $if:
                  $equal:
                    - OffenseSentenceTypeName
                    - $literal("Death")
                $then: $literal_bool(True)
              - $else: $literal_bool(False)
